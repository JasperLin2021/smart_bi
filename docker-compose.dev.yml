services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_bi_dev}
      POSTGRES_USER: ${POSTGRES_USER:-smart_bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_bi_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://smart_bi:smart_bi_dev_password@postgres:5432/smart_bi_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_only_replace_if_shared}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:8001/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change_me_for_local_llm}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_PI_BASE: ${LLM_PI_BASE:-http://host.docker.internal:8001/v1}
      LLM_PI_KEY: ${LLM_PI_KEY:-change_me_for_local_llm}
      LLM_PI_MODEL: ${LLM_PI_MODEL:-pi/pi-mono}
      LLM_DASHSCOPE_BASE: ${LLM_DASHSCOPE_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_DASHSCOPE_KEY: ${LLM_DASHSCOPE_KEY:-change_me_for_dashscope}
      LLM_DASHSCOPE_MODEL: ${LLM_DASHSCOPE_MODEL:-qwen3.6-35b-a3b}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-120}
      CUBE_API_URL: ${CUBE_API_URL:-http://host.docker.internal:4000/cubejs-api/v1}
      CUBE_API_TOKEN: ${CUBE_API_TOKEN:-change_me}
      DORIS_ENABLED: ${DORIS_ENABLED:-false}
      DORIS_HOST: ${DORIS_HOST:-doris-fe}
      DORIS_QUERY_PORT: ${DORIS_QUERY_PORT:-9030}
      DORIS_HTTP_PORT: ${DORIS_HTTP_PORT:-8030}
      DORIS_USER: ${DORIS_USER:-root}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
      DORIS_DATABASE: ${DORIS_DATABASE:-smart_bi_olap}
      DORIS_MATERIALIZATION_LIMIT: ${DORIS_MATERIALIZATION_LIMIT:-100000}
      GOVIEW_ENABLED: ${GOVIEW_ENABLED:-false}
      GOVIEW_BASE_URL: ${GOVIEW_BASE_URL:-http://host.docker.internal:3000}
      GOVIEW_EMBED_BASE_URL: ${GOVIEW_EMBED_BASE_URL:-http://host.docker.internal:3000}
      GOVIEW_VIEW_PATH: ${GOVIEW_VIEW_PATH:-/#/project/items}
      GOVIEW_DESIGN_PATH: ${GOVIEW_DESIGN_PATH:-/#/project/items}
      GOVIEW_BRIDGE_SECRET: ${GOVIEW_BRIDGE_SECRET:-dev_only_goview_secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8002}:8001"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - backend_dev_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 16006"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_DEV_PORT:-16006}:16006"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules

  demo-seed:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["demo"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-smart_bi_dev}
      PGUSER: ${POSTGRES_USER:-smart_bi}
      PGPASSWORD: ${POSTGRES_PASSWORD:-smart_bi_dev_password}
    volumes:
      - ./mock_data.sql:/mock_data.sql:ro
    command:
      [
        "sh",
        "-c",
        "psql -v ON_ERROR_STOP=1 -f /mock_data.sql && echo 'Smart BI demo data imported.'",
      ]

volumes:
  postgres_dev_data:
  backend_dev_uploads:
  frontend_dev_node_modules:
