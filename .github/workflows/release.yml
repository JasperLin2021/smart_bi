name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Archive dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Package frontend dist
        run: |
          cd frontend
          zip -r ../smart-bi-frontend-${{ github.ref_name }}.zip dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Smart BI ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            smart-bi-frontend-${{ github.ref_name }}.zip
          body: |
            ## Smart BI ${{ github.ref_name }}

            企业级 AI 驱动商业智能平台

            ### 快速部署

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd smart_bi
            cp .env.example .env
            # 编辑 .env 填入必要配置
            docker compose up -d --build
            ```

            访问 http://localhost:16006

            ### 附件

            - `smart-bi-frontend-${{ github.ref_name }}.zip` — 前端编译产物（已编译，可直接部署到 Nginx/CDN）

            详细部署文档见 [README](https://github.com/${{ github.repository }}#readme)。
