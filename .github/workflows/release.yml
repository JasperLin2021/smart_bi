name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Package dist
        run: zip -r smart-bi-frontend-${{ github.ref_name }}.zip frontend/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Smart BI ${{ github.ref_name }}"
          generate_release_notes: true
          files: smart-bi-frontend-${{ github.ref_name }}.zip
          body: |
            ## Smart BI ${{ github.ref_name }}

            企业级 AI 驱动商业智能平台

            ### 快速部署

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd smart_bi
            cp .env.production.example .env.production
            # 编辑 .env.production 填入生产密码、JWT_SECRET、LLM 和集成配置
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            ```

            访问 http://localhost:16006 · 默认账号：`admin` / `admin123`

            > 上线前请立即修改所有默认密码。

            详细文档见 [README](https://github.com/${{ github.repository }}#readme)。
