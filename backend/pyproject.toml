[project]
name = "smart-bi-backend"
version = "0.1.0"
description = "Backend service for smart_bi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt<4.1",
    "duckdb>=0.9.0",
    "fastapi==0.115.0",
    "fastapi-cache2==0.2.2",
    "httpx[socks]==0.27.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.0",
    "pandas==2.2.2",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.5.2",
    "python-jose==3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy==2.0.34",
    "uvicorn[standard]==0.30.6",
    "apscheduler>=3.10,<4",
    "alembic>=1.13,<2",
    "pymysql>=1.1.3",
    "pymssql>=2.3.13",
    "clickhouse-sqlalchemy>=0.3.2",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Start intentionally small so the gate is enforceable today (see CI); expand over time.
# E/W: pycodestyle, F: pyflakes (undefined names, unused imports), I: import sorting.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
